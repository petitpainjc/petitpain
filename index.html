document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

}}\" style=\"width:120px;height:56px;border:1px solid #3a3a42;background:#0e0e10;border-radius:12px;padding:0 12px;font-size:20px;font-weight:600;text-align:right\">\n<\u002Fdiv>\n<sc-if value=\"{{ d.deltaText }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size:14px;font-weight:600;color:#e8a33d\">{{ d.deltaText }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"background:#221f1a;border:1px solid #6b5326;border-radius:18px;padding:18px\">\n<div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#c79b4f\">Bulk terminé<\u002Fdiv>\n<div style=\"font-size:52px;font-weight:700;line-height:1.05;color:#e8a33d;margin-top:6px\">{{ finishedAt }}<\u002Fdiv>\n<div style=\"font-size:14px;color:#b8b1a5;margin-top:6px\">{{ sessionLength }}<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ doneRows }}\" as=\"c\" hint-placeholder-count=\"3\">\n<div style=\"background:#17171b;border:1px solid #2c2c32;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px\">\n<span style=\"font-size:26px;font-weight:700;color:#e8a33d;width:34px\">{{ c.count }}<\u002Fspan>\n<div style=\"flex:1 1 auto;min-width:0\">\n<div style=\"font-size:16px;font-weight:600\">{{ c.name }}<\u002Fdiv>\n<div style=\"font-size:13px;color:#8d8880\">{{ c.compo }} — {{ c.totalWeight }} g<\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-size:14px;font-weight:600;color:#a8a39a\">{{ c.progress }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isReminders }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div>\n<div style=\"font-size:15px;font-weight:650;color:#e8a33d;margin-bottom:8px\">À préparer à part, hors process levain<\u002Fdiv>\n<sc-if value=\"{{ hasEnriched }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ enrichedRows }}\" as=\"e\" hint-placeholder-count=\"2\">\n<div style=\"background:#17171b;border:1px solid #2c2c32;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px\">\n<span style=\"font-size:26px;font-weight:700;color:#e8a33d;width:34px\">{{ e.qty }}<\u002Fspan>\n<div style=\"flex:1 1 auto;min-width:0\">\n<div style=\"font-size:16px;font-weight:600\">{{ e.product }}<\u002Fdiv>\n<div style=\"font-size:13px;color:#8d8880\">{{ e.client }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ noEnriched }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size:14px;color:#8d8880\">Aucun Challah ni Babka pour cette date.<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div>\n<div style=\"font-size:15px;font-weight:650;color:#e8a33d;margin-bottom:8px\">Découpe demandée<\u002Fdiv>\n<sc-if value=\"{{ hasSlices }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ sliceRows }}\" as=\"s\" hint-placeholder-count=\"1\">\n<div style=\"background:#17171b;border:1px solid #2c2c32;border-radius:14px;padding:12px 14px\">\n<div style=\"font-size:16px;font-weight:600\">{{ s.client }}<\u002Fdiv>\n<div style=\"font-size:13px;color:#a8a39a;margin-top:2px\">{{ s.text }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ noSlices }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size:14px;color:#8d8880\">Aucune demande de découpe.<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<sc-if value=\"{{ hasOtherComments }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<div style=\"font-size:15px;font-weight:650;color:#a8a39a;margin-bottom:8px\">Autres commentaires<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ otherComments }}\" as=\"o\" hint-placeholder-count=\"1\">\n<div style=\"background:#141418;border:1px solid #26262c;border-radius:12px;padding:10px 12px;font-size:13px;color:#a8a39a;line-height:1.4\">{{ o }}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<button sc-camel-on-click=\"{{ restart }}\" style=\"border:1px solid #3a3a42;background:#17171b;color:#a8a39a;border-radius:14px;height:56px;font-size:15px;font-weight:600;cursor:pointer\">Nouvelle session<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<div style=\"flex:0 0 auto;padding:10px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#0e0e1000,#0e0e10 30%)\">\n<sc-if value=\"{{ nextReady }}\" hint-placeholder-val=\"{{ true }}\">\n<button sc-camel-on-click=\"{{ goNext }}\" style=\"width:100%;height:64px;border:none;background:#e8a33d;color:#191308;border-radius:16px;font-size:19px;font-weight:700;letter-spacing:-.01em;cursor:pointer\">{{ nextLabel }}<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ nextBlocked }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"width:100%;height:64px;background:#1c1c21;color:#6f6a63;border:1px solid #2c2c32;border-radius:16px;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center\">{{ blockedLabel }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:916},&quot;margeMin&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:25,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:60,&quot;step&quot;:5,&quot;unit&quot;:&quot;min&quot;,&quot;section&quot;:&quot;Session&quot;},&quot;toleranceG&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:5,&quot;max&quot;:30,&quot;step&quot;:5,&quot;unit&quot;:&quot;g&quot;,&quot;section&quot;:&quot;Pesée&quot;},&quot;showCumulativeWeight&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Pesée&quot;}}\">\n/* Petit Pain — assistant de préparation du soir.\n   Modèle strictement additif : tout part des grammages unitaires ci-dessous. */\n\nconst SHEET_ID = '1RLmlKiQtQxKV4BNrrnRbhg0eOVrOAPUTSn6HeR5qek4';\nconst CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=ORDERS';\nconst LS = 'petitpain.v1';\nconst LS_CACHE = 'petitpain.cache.v1';\n\n/* Grammages unitaires — source de vérité (onglet Menu / recette). */\nconst UNIT = {\n  big:  { sourdough: 180, water: 300, ww: 115, bread: 345, flour: 460, filling: 90, salt: 10.5 },\n  loaf: { sourdough: 102, water: 170, ww: 65,  bread: 195, flour: 260, filling: 50, salt: 6 }\n};\n/* Poids unitaire à la découpe = somme des ingrédients, jamais codé en dur. */\nfunction unitTotal(size, hasFilling) {\n  const u = UNIT[size];\n  return u.sourdough + u.water + u.flour + (hasFilling ? u.filling : 0) + u.salt;\n}\n\nconst FAMILIES = [\n  { id: 'classics', name: 'Classics', filling: null },\n  { id: 'seeds', name: 'Seeds', filling: 'graines' },\n  { id: 'wo', name: 'Walnuts & Olives', filling: 'noix & olives' }\n];\n\nconst CATALOG = [\n  { key: 'classic1', label: 'Classic 1lb', family: 'classics', size: 'loaf' },\n  { key: 'seeds1', label: 'Seeds 1lb', family: 'seeds', size: 'loaf' },\n  { key: 'wo1', label: 'Walnuts & Olives 1lb', family: 'wo', size: 'loaf' },\n  { key: 'bigclassic', label: 'Big Classic 2lbs', family: 'classics', size: 'big' },\n  { key: 'bigseeds', label: 'Big Seeds 2lbs', family: 'seeds', size: 'big' },\n  { key: 'bigwo', label: 'Big Walnuts & Olives 2lbs', family: 'wo', size: 'big' },\n  { key: 'challah', label: 'Challah', family: null, size: null },\n  { key: 'babka', label: 'Babka Choco 1lb', family: null, size: null }\n];\n\nconst STEPS = [\n  { id: 's1', n: 1, title: 'Levain', kind: 'weigh', field: 'sourdough' },\n  { id: 's2', n: 2, title: 'Eau', kind: 'weigh', field: 'water' },\n  { id: 's3', n: 3, title: 'Mélanger', kind: 'mix' },\n  { id: 's4', n: 4, title: 'Farine & Filling', kind: 'flour' },\n  { id: 's5', n: 5, title: 'Mélanger puis autolyse', kind: 'timer', mins: 20 },\n  { id: 's6', n: 6, title: 'Sel', kind: 'weigh', field: 'salt' },\n  { id: 's7', n: 7, title: 'Mélanger', kind: 'timer', mins: 30 },\n  { id: 's8', n: 8, title: 'S&F 1/3', kind: 'timer', mins: 30 },\n  { id: 's9', n: 9, title: 'S&F 2/3', kind: 'timer', mins: 30 },\n  { id: 's10', n: 10, title: 'S&F 3/3', kind: 'timer', mins: 30 },\n  { id: 's11', n: 11, title: 'Division & pesée', kind: 'divide' }\n];\nconst FLOW = ['summary'].concat(STEPS.map(s => s.id)).concat(['done', 'reminders']);\n\nconst RX_FILLING = /(olives?\\s*(uniquement|seulement|only)|only\\s*olives|sans\\s*noix|no\\s*walnuts?|sans\\s*graines|no\\s*seeds?)/i;\nconst RX_SLICE = /(sliced|thin\\s*slices|tranch)/i;\nconst RX_CANCEL = /(declined|annul|cancel)/i;\nconst RX_ERR = /#(n\\/a|value!|ref!)/i;\n\n/* ---------- utilitaires ---------- */\nfunction norm(s) {\n  return String(s || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').trim();\n}\n/* Arrondi d'affichage au 0,5 g, sans décimale inutile, virgule française. */\nfunction fmt(n) {\n  const r = Math.round(n * 2) / 2;\n  return (Number.isInteger(r) ? String(r) : String(r).replace('.', ',')).replace('-0', '0');\n}\nfunction pad(n) { return n < 10 ? '0' + n : String(n); }\nfunction hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }\nfunction todayKey(offsetDays) {\n  const d = new Date();\n  d.setDate(d.getDate() + (offsetDays || 0));\n  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());\n}\nfunction keyToFr(k) {\n  if (!k) return '';\n  const p = k.split('-');\n  return p[2] + '/' + p[1] + '/' + p[0];\n}\n/* Parseur CSV complet : guillemets, virgules et retours à la ligne échappés. */\nfunction parseCSV(text) {\n  const rows = []; let row = [], cell = '', inQ = false;\n  for (let i = 0; i < text.length; i++) {\n    const c = text[i];\n    if (inQ) {\n      if (c === '\"') { if (text[i + 1] === '\"') { cell += '\"'; i++; } else inQ = false; }\n      else cell += c;\n    } else if (c === '\"') inQ = true;\n    else if (c === ',') { row.push(cell); cell = ''; }\n    else if (c === '\\n') { row.push(cell); rows.push(row); row = []; cell = ''; }\n    else if (c !== '\\r') cell += c;\n  }\n  if (cell.length || row.length) { row.push(cell); rows.push(row); }\n  return rows.filter(r => r.some(v => String(v).trim() !== ''));\n}\n/* Date JJ/MM/AAAA (et quelques variantes) -> clé AAAA-MM-JJ. */\nfunction parseDate(v) {\n  const s = String(v || '').trim();\n  let m = s.match(/^(\\d{1,2})[\\/\\-.](\\d{1,2})[\\/\\-.](\\d{2,4})$/);\n  if (m) {\n    let y = +m[3]; if (y < 100) y += 2000;\n    const d = +m[1], mo = +m[2];\n    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;\n    return y + '-' + pad(mo) + '-' + pad(d);\n  }\n  m = s.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);\n  if (m) return m[1] + '-' + m[2] + '-' + m[3];\n  m = s.match(/^Date\\((\\d+),(\\d+),(\\d+)\\)$/);\n  if (m) return (+m[1]) + '-' + pad(+m[2] + 1) + '-' + pad(+m[3]);\n  return null;\n}\nfunction catalogFor(product) {\n  const p = norm(product);\n  if (!p) return null;\n  if (/challah/.test(p)) return CATALOG[6];\n  if (/babka/.test(p)) return CATALOG[7];\n  const big = /\\bbig\\b/.test(p) || /2\\s*lb/.test(p);\n  let fam = null;\n  if (/walnut|olive/.test(p)) fam = 'wo';\n  else if (/seed|graine/.test(p)) fam = 'seeds';\n  else if (/classic/.test(p)) fam = 'classics';\n  if (!fam) return null;\n  return CATALOG.find(c => c.family === fam && c.size === (big ? 'big' : 'loaf'));\n}\n\nclass Component extends DCLogic {\n  state = this.load();\n\n  load() {\n    const base = {\n      screen: 'summary', dateKey: todayKey(1), checks: {}, mix: {}, patons: {},\n      real: {}, timers: {}, timerDone: {}, manual: null, useManual: false,\n      rows: null, stamp: null, ignored: [], showIgnored: false, banner: '',\n      finishedAt: null, startedAt: null\n    };\n    try {\n      const s = JSON.parse(localStorage.getItem(LS) || 'null');\n      if (s) Object.assign(base, s);\n      const c = JSON.parse(localStorage.getItem(LS_CACHE) || 'null');\n      if (c && c.rows) { base.rows = c.rows; base.stamp = c.stamp; base.ignored = c.ignored || []; }\n    } catch (e) {}\n    return base;\n  }\n  persist(patch) {\n    this.setState(patch, () => {\n      const s = this.state;\n      try {\n        localStorage.setItem(LS, JSON.stringify({\n          screen: s.screen, dateKey: s.dateKey, checks: s.checks, mix: s.mix, patons: s.patons,\n          real: s.real, timers: s.timers, timerDone: s.timerDone, manual: s.manual,\n          useManual: s.useManual, showIgnored: s.showIgnored, finishedAt: s.finishedAt, startedAt: s.startedAt\n        }));\n      } catch (e) {}\n    });\n  }\n\n  componentDidMount() {\n    this.injectManifest();\n    this.tick = setInterval(() => { if (this.state.timers[this.state.screen]) this.forceUpdate(); }, 250);\n    this.onVis = () => { if (document.visibilityState === 'visible' && this.anyTimer()) this.acquireLock(); };\n    document.addEventListener('visibilitychange', this.onVis);\n    this.fetchOrders();\n  }\n  componentWillUnmount() {\n    clearInterval(this.tick);\n    document.removeEventListener('visibilitychange', this.onVis);\n    this.stopSound();\n  }\n  /* Manifest inline (blob) + theme-color : rendu type PWA depuis l'écran d'accueil. */\n  injectManifest() {\n    if (document.querySelector('link[rel=\"manifest\"]')) return;\n    const mf = {\n      name: 'Petit Pain — Prépa du soir', short_name: 'Petit Pain', display: 'standalone',\n      background_color: '#0e0e10', theme_color: '#0e0e10', orientation: 'portrait', start_url: '.'\n    };\n    const url = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' }));\n    const l = document.createElement('link'); l.rel = 'manifest'; l.href = url;\n    document.head.appendChild(l);\n  }\n\n  /* ---------- données ---------- */\n  async fetchOrders() {\n    try {\n      const res = await fetch(CSV_URL, { cache: 'no-store' });\n      if (!res.ok) throw new Error('HTTP ' + res.status);\n      const txt = await res.text();\n      if (/<html/i.test(txt)) throw new Error('non partagé');\n      const { rows, ignored } = this.cleanRows(parseCSV(txt));\n      const stamp = Date.now();\n      try { localStorage.setItem(LS_CACHE, JSON.stringify({ rows, ignored, stamp })); } catch (e) {}\n      /* Si on était en secours automatique sans rien avoir saisi, on revient au Sheet. */\n      const st = this.state;\n      const manualEmpty = !st.manual || !Object.keys(st.manual).some(k => st.manual[k] > 0);\n      const patch = { rows, ignored, stamp, banner: '' };\n      if (st.useManual && manualEmpty) {\n        patch.useManual = false; patch.manual = null;\n        if (st.screen === 'manual') patch.screen = 'summary';\n      }\n      this.persist(patch);\n    } catch (e) {\n      if (this.state.rows) {\n        this.persist({ banner: 'Lecture du Sheet impossible (' + e.message + '). Données en cache utilisées.' });\n      } else {\n        this.persist({\n          banner: 'Lecture du Sheet impossible (' + e.message + '). Partage « tous les utilisateurs avec le lien » requis. Bascule en saisie manuelle.',\n          useManual: true, manual: this.state.manual || {}, screen: 'manual'\n        });\n      }\n    }\n  }\n  /* Nettoyage obligatoire du bruit de l'onglet. */\n  cleanRows(raw) {\n    if (!raw.length) return { rows: [], ignored: [] };\n    const head = raw[0].map(h => norm(h));\n    const col = name => head.indexOf(norm(name));\n    const idx = {\n      week: col('Week'), day: col('Day'), date: col('Delivery Date'), client: col('Client'),\n      address: col('Address'), qty: col('Quantity'), product: col('Product'),\n      price: col('Price'), comments: col('Comments'), details: col('Delivery Details')\n    };\n    const rows = [], ignored = [];\n    for (let i = 1; i < raw.length; i++) {\n      const r = raw[i];\n      const get = k => (idx[k] >= 0 ? String(r[idx[k]] || '').trim() : '');\n      const named = ['week', 'day', 'date', 'client', 'address', 'qty', 'product', 'price', 'comments', 'details'].map(get);\n      /* Ligne vide dans les colonnes utiles (bas de feuille, colonnes de formules) : ignorée sans bruit. */\n      /* Ligne sans contenu utile (date/client/produit/quantité) : bas de feuille ou\n         colonnes de formules en #N/A — ignorée silencieusement, pas signalée. */\n      const core = [get('date'), get('client'), get('product'), get('qty')].filter(v => v !== '' && !RX_ERR.test(v));\n      if (!core.length) continue;\n      if (!named.some(v => v !== '')) continue;\n      const line = 'L' + (i + 1) + ' · ' + [get('date'), get('client'), get('qty'), get('product')].filter(Boolean).join(' · ');\n      if (named.some(v => RX_ERR.test(v))) { ignored.push(line + ' — cellule en erreur'); continue; }\n      const dateKey = parseDate(get('date'));\n      if (!dateKey) { ignored.push(line + ' — date vide ou illisible'); continue; }\n      const q = parseFloat(String(get('qty')).replace(',', '.'));\n      if (!isFinite(q) || q <= 0) { ignored.push(line + ' — quantité invalide'); continue; }\n      const comments = get('comments');\n      if (RX_CANCEL.test(comments)) { ignored.push(line + ' — commande annulée'); continue; }\n      const cat = catalogFor(get('product'));\n      if (!cat) { ignored.push(line + ' — produit inconnu : ' + get('product')); continue; }\n      rows.push({ dateKey, client: get('client'), qty: Math.round(q), key: cat.key, comments });\n    }\n    return { rows, ignored };\n  }\n\n  /* Lignes retenues pour la date choisie (Sheet ou saisie manuelle). */\n  activeRows() {\n    const s = this.state;\n    if (s.useManual && s.manual) {\n      const out = [];\n      CATALOG.forEach(c => {\n        const q = s.manual[c.key] || 0;\n        if (q > 0) \n    let ready = true, blockedLabel = '';\n    if (step && (step.kind === 'weigh' || step.kind === 'flour')) {\n      const done = containers.filter(c => (s.checks[step.id] || {})[c.id]).length;\n      ready = containers.length > 0 && done === containers.length;\n      blockedLabel = done + ' / ' + containers.length + ' récipients cochés';\n    } else if (step && step.kind === 'mix') {\n      ready = !!s.mix[step.id]; blockedLabel = 'Coche « fait »';\n    } else if (step && step.kind === 'timer') {\n      ready = !!s.timerDone[step.id]; blockedLabel = end ? 'Timer en cours' : 'Démarre le timer';\n    } else if (step && step.kind === 'divide') {\n      const total = containers.reduce((a, c) => a + c.count, 0);\n      const done = containers.reduce((a, c) => a + Object.keys(s.patons[c.id] || {}).filter(k => s.patons[c.id][k]).length, 0);\n      ready = total > 0 && done === total;\n      blockedLabel = done + ' / ' + total + ' pâtons pesés';\n    } else if (s.screen === 'summary') {\n      ready = containers.length > 0;\n      blockedLabel = 'Aucune commande pour cette date';\n    }\n\n    const nextLabel = s.screen === 'summary' ? 'Commencer'\n      : s.screen === 'manual' ? 'Valider la saisie'\n      : s.screen === 'done' ? 'Rappels pour demain'\n      : s.screen === 'reminders' ? 'Terminer' : 'Suivant';\n\n    /* écran 0 : fin estimée */\n    const totalMins = 20 + 30 * 4 + marge;\n    const endEst = new Date(Date.now() + totalMins * 60000);\n\n    const containerCards = containers.map(c => ({\n      name: c.famName, compo: c.compo, count: c.count, totalWeight: fmt(c.totalWeight),\n      progress: Object.keys(s.patons[c.id] || {}).filter(k => s.patons[c.id][k]).length + '/' + c.count + ' pesés'\n    }));\n\n    /* étapes de pesée */\n    const weighRows = (step && step.kind === 'weigh') ? containers.map(c => {\n      const checked = !!(s.checks[step.id] || {})[c.id];\n      const value = step.field === 'sourdough' ? c.sourdough : step.field === 'water' ? c.water : patons = [];\n      for (let i = 0; i < c.bigs; i++) patons.push({ label: 'Big', w: c.bigWeight * ratio });\n      for (let i = 0; i < c.loaves; i++) patons.push({ label: '1 Lb', w: c.loafWeight * ratio });\n      const doneCount = Object.keys(s.patons[c.id] || {}).filter(k => s.patons[c.id][k]).length;\n      let instruction;\n      if (c.count === 1) instruction = '1 seul pâton, rien à couper.';\n      else if (c.bigs && c.loaves) instruction = 'Couper ' + (c.bigs === 1 ? '1 Big' : c.bigs + ' × Big') + ' = ' + fmt(c.bigWeight * ratio) + ' g, puis ' + c.loaves + ' × 1 Lb de ' + fmt(c.loafWeight * ratio) + ' g.';\n      else if (c.bigs) instruction = 'Couper ' + c.bigs + ' × Big de ' + fmt(c.bigWeight * ratio) + ' g.';\n      else instruction = 'Couper ' + c.loaves + ' × 1 Lb de ' + fmt(c.loafWeight * ratio) + ' g.';\n      const deltaText = ratio !== 1\n        ? 'Écart ' + fmt((ratio - 1) * 100 * 10) / 10 + ' % — poids recalculés au prorata.'\n        : '';\n      return {\n        name: c.famName, compo: c.compo, totalWeight: fmt(c.totalWeight),\n        progress: doneCount + '/' + c.count + ' pesés', instruction,\n        realValue: s.real[c.id] || '',\n        onReal: e => {\n          const r = Object.assign({}, this.state.real); r[c.id] = e.target.value;\n          this.persist({ real: r });\n        },\n        deltaText: ratio !== 1 ? 'Écart ' + fmt(Math.round((ratio - 1) * 1000) / 10) + ' % — poids de découpe recalculés au prorata.' : '',\n        borderColor: doneCount === c.count ? '#6b5326' : '#2c2c32',\n        patons: patons.map((p, i) => {\n          const on = !!(s.patons[c.id] || {})[i];\n          return {\n            label: p.label, weight: fmt(p.w), toggle: () => this.togglePaton(c.id, i),\n            borderColor: on ? '#6b5326' : '#3a3a42', bgColor: on ? '#1b1913' : '#0e0e10',\n            checkBorder: on ? '#e8a33d' : '#3a3a42', checkBg: on ? '#e8a33d' : 'transparent',\n            mark: on ? '✓' : ''\n          };\n        })\n      };\n    }) : [];\n\n    /* écran 13 : rappels */\n    const enriched = rows.filter(r => { const c = CATALOG.find(x => x.key === r.key); return c && !c.family; })\n      .map(r => ({ qty: r.qty, product: (CATALOG.find(x => x.key === r.key) || {}).label, client: r.client }));\n    const sliceRows = rows.filter(r => RX_SLICE.test(r.comments || ''))\n      .map(r => ({ client: r.client, text: r.comments + ' — ' + r.qty + ' × ' + (CATALOG.find(x => x.key === r.key) || {}).label }));\n    const otherComments = rows.filter(r => r.comments && !RX_SLICE.test(r.comments) && !RX_FILLING.test(r.comments))\n      .map(r => r.client + ' : ' + r.comments);\n\n    const manualRows = CATALOG.map(c => ({\n      name: c.label, note: c.family ? 'levain' : 'hors process',\n      qty: (s.manual || {})[c.key] || 0,\n      inc: () => {\n        const m = Object.assign({}, this.state.manual || {}); m[c.key] = (m[c.key] || 0) + 1;\n        this.persist({ manual: m, useManual: true });\n      },\n      dec: () => {\n        const m = Object.assign({}, this.state.manual || {}); m[c.key] = Math.max(0, (m[c.key] || 0) - 1);\n        this.persist({ manual: m, useManual: true });\n      }\n    }));\n\n    const finished = s.finishedAt ? new Date(s.finishedAt) : null;\n\n    return {\n      progressPct, stepLabel,\n      title: step ? step.title : s.screen === 'summary' ? 'Résumé du soir' : s.screen === 'manual' ? 'Saisie manuelle' : s.screen === 'done' ? 'Session terminée' : 'Rappels demain matin',\n      showBack: s.screen !== 'summary',\n      goBack: () => this.go(-1),\n      goNext: () => this.go(1),\n      nextLabel, nextReady: ready, nextBlocked: !ready, blockedLabel,\n      banner: s.banner || '',\n      soundPlaying: !!this.soundOn,\n      muteSound: () => { this.stopSound(); this.forceUpdate(); },\n\n      isSummary: s.screen === 'summary', isManual: s.screen === 'manual',\n      isWeigh: !!(step && step.kind === 'weigh'), isFlour: !!(step && step.kind === 'flour'),\n      isMix: !!(step && step.kind === 'mix'), isTimer: !!(step && step.kind === 'timer'),\n      isDivide: !!(step && step.kind === 'divide'),\n      isDone: s.screen === 'done', isReminders: s.screen === 'reminders',\n\n      dateValue: s.dateKey, dateLabel: keyToFr(s.dateKey),\n      onDate: e => this.resetSession(e.target.value),\n      refresh: () => this.fetchOrders(),\n      dataStamp: s.stamp\n        ? 'données du ' + pad(new Date(s.stamp).getDate()) + '/' + pad(new Date(s.stamp).getMonth() + 1) + ' à ' + hhmm(new Date(s.stamp))\n        : (s.useManual ? 'saisie manuelle' : 'lecture en cours…'),\n      totalLoaves, containerCountLabel: containers.length + ' récipient(s) à sortir',\n      containers: containerCards, doneRows: containerCards,\n      totalLevain: fmt(totalLevain),\n      endEstimate: hhmm(endEst),\n      timersLabel: '20 + 30 + 30 + 30 + 30 min + ' + marge + ' min de marge',\n      hasIgnored: (s.ignored || []).length > 0,\n      ignoredLabel: (s.ignored || []).length + ' ligne(s) ignorée(s) — voir le détail',\n      showIgnored: !!s.showIgnored, ignoredRows: s.ignored || [],\n      toggleIgnored: () => this.persist({ showIgnored: !this.state.showIgnored }),\n      goManual: () => this.persist({ screen: 'manual', useManual: true, manual: this.state.manual || {} }),\n      clearManual: () => this.persist({ useManual: false, manual: null, screen: 'summary' }),\n      manualRows,\n\n      weighRows, flourRows, divideCards,\n      /* La note de tolérance ne s'affiche que si aucun poids réel n'a été saisi. */\n      toleranceNote: containers.some(c => {\n        const v = parseFloat(String(s.real[c.id] || '').replace(',', '.'));\n        return isFinite(v) && v > 0;\n      }) ? '' : 'Viser ces poids, tolérance ± ' + tol + ' g par pâton.',\n\n      mixInstruction: 'Mélanger le levain et l\\'eau jusqu\\'à dissolution complète, dans chaque récipient.',\n      toggleMix: () => {\n        const m = Object.assign({}, this.state.mix); m[step.id] = !m[step.id];\n        this.persist({ mix: m });\n      },\n      mixMark: step && s.mix[step.id] ? '✓' : '',\n      mixBorder: step && s.mix[step.id] ? '#6b5326' : '#3a3a42',\n      mixBg: step && s.mix[step.id] ? '#1b1913' : '#17171b',\n      mixCheckBorder: step && s.mix[step.id] ? '#e8a33d' : '#3a3a42',\n      mixCheckBg: step && s.mix[step.id] ? '#e8a33d' : 'transparent',\n\n      timerInstruction: step && step.id === 's5' ? 'Mélanger farine et filling à la pâte, puis autolyse 20 min.'\n        : step && step.id === 's7' ? 'Mélanger le sel, puis repos 30 min.'\n        : step ? 'Stretch and fold ' + step.title.replace('S&F ', '') + ' sur chaque récipient, puis repos 30 min.' : '',\n      timerMins: mins, timerText,\n      timerEndText: end ? 'fin à ' + hhmm(new Date(end)) : (tid && s.timerDone[tid] ? 'terminé' : 'non démarré'),\n      ringDash: ringDash, ringOffset: ringDash * (1 - frac), ringColor: end ? '#e8a33d' : '#3a3a42',\n      timerIdle: !!(tid && !end && !s.timerDone[tid]), timerActive: !!end, timerDone: !!(tid && !end && s.timerDone[tid]),\n      startTimer: () => this.startTimer(tid, mins),\n      plus5: () => this.bumpTimer(tid, 5),\n      skipTimer: () => this.skipTimer(tid),\n\n      finishedAt: finished ? hhmm(finished) : '—',\n      sessionLength: s.startedAt && finished ? 'session de ' + Math.round((s.finishedAt - s.startedAt) / 60000) + ' min · ' + totalLoaves + ' pains · ' + fmt(totalLevain) + ' g de levain' : totalLoaves + ' pains · ' + fmt(totalLevain) + ' g de levain',\n\n      hasEnriched: enriched.length > 0, noEnriched: enriched.length === 0, enrichedRows: enriched,\n      hasSlices: sliceRows.length > 0, noSlices: sliceRows.length === 0, sliceRows,\n      hasOtherComments: otherComments.length > 0, otherComments,\n      restart: () => this.resetSession()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
